name: Task
description: Track implementation, planning, maintenance, or documentation work.
title: "[Task]: "
body:
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: Describe the result this task should deliver and why it is needed.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and references
      description: Link blocking issues and any relevant Spec Kit specification, plan, or task entries.
